[build]
  publish = "."
  command = "echo 'No build needed - static site'"

[[redirects]]
  from = "/config.js"
  to = "/config.example.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
